<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="440" viewBox="0 0 1280 440" role="img" aria-labelledby="title desc">
<title id="title">ResearchOS — From evidence to action</title>
<desc id="desc">Original ResearchOS project banner: connect questions, versioned sources, evidence and preserved decisions to the next action. Early alpha.</desc>
