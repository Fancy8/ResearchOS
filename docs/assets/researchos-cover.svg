<text x="140" y="82" text-anchor="middle" font-size="12" font-weight="700" letter-spacing="2" fill="#315d49">OPEN RESEARCH</text>
<text x="62" y="169" font-size="72" font-weight="700" letter-spacing="-3" fill="#183b32">ResearchOS</text>
<text x="66" y="218" font-size="27" fill="#315d49">From evidence to action.</text>
<text x="66" y="262" font-size="17" fill="#52625a">Keep the source. Preserve the reasoning.</text>
<text x="66" y="290" font-size="17" fill="#52625a">Make your next research step traceable.</text>
