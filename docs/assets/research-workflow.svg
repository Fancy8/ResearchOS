<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="278" viewBox="0 0 1200 278" role="img" aria-labelledby="title desc"><title id="title">ResearchOS research workflow</title><desc id="desc">Question to paper, evidence, hypothesis, decision revision and task; review returns to the question.</desc><rect width="1200" height="278" rx="18" fill="#f7f8f4"/><text x="30" y="38" font-family="Arial,sans-serif" font-size="13" font-weight="700" letter-spacing="2" fill="#52625a">ONE QUESTION. A TRACEABLE CHAIN OF REASONING.</text><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#73917b" stroke-width="1.4"/></marker></defs><rect x="30" y="72" width="160" height="90" rx="12" fill="#ffffff" stroke="#c7d5c9"/><g font-family="Arial,sans-serif" text-anchor="middle"><text x="110" y="110" font-size="17" font-weight="700" fill="#183b32">Question</text><text x="110" y="138" font-size="12" fill="#52625a">Define the problem</text></g><path d="M190 116H222" stroke="#73917b" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="226" y="72" width="160" height="90" rx="12" fill="#ffffff" stroke="#c7d5c9"/><g font-family="Arial,sans-serif" text-anchor="middle"><text x="306" y="110" font-size="17" font-weight="700" fill="#183b32">Paper</text><text x="306" y="138" font-size="12" fill="#52625a">Retain the version</text></g><path d="M386 116H418" stroke="#73917b" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="422" y="72" width="160" height="90" rx="12" fill="#ffffff" stroke="#c7d5c9"/><g font-family="Arial,sans-serif" text-anchor="middle"><text x="502" y="110" font-size="17" font-weight="700" fill="#183b32">Evidence</text><text x="502" y="138" font-size="12" fill="#52625a">Anchor to the source</text></g><path d="M582 116H614" stroke="#73917b" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="618" y="72" width="160" height="90" rx="12" fill="#ffffff" stroke="#c7d5c9"/><g font-family="Arial,sans-serif" text-anchor="middle"><text x="698" y="110" font-size="17" font-weight="700" fill="#183b32">Hypothesis</text><text x="698" y="138" font-size="12" fill="#52625a">Record uncertainty</text></g><path d="M778 116H810" stroke="#73917b" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="814" y="72" width="160" height="90" rx="12" fill="#183b32" stroke="#c7d5c9"/><g font-family="Arial,sans-serif" text-anchor="middle"><text x="894" y="110" font-size="17" font-weight="700" fill="#ffffff">Decision</text><text x="894" y="138" font-size="12" fill="#c7d5c9">Preserve the revision</text></g><path d="M974 116H1006" stroke="#73917b" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="1010" y="72" width="160" height="90" rx="12" fill="#ffffff" stroke="#c7d5c9"/><g font-family="Arial,sans-serif" text-anchor="middle"><text x="1090" y="110" font-size="17" font-weight="700" fill="#183b32">Task</text><text x="1090" y="138" font-size="12" fill="#52625a">Keep the provenance</text></g><path d="M1090 162V211H110V174" fill="none" stroke="#73917b" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="350" y="195" width="500" height="32" rx="16" fill="#f7f8f4"/><g font-family="Arial,sans-serif" text-anchor="middle" fill="#52625a"><text x="600" y="216" font-size="14">Review the outcome and revisit the question</text><text x="600" y="257" font-size="12">Conceptual workflow — not a product screenshot or scientific result.</text></g></svg>
