[project]
name = "researchos-backend"
version = "0.1.0"
requires-python = ">=3.12,<3.15"
dependencies = [
  "fastapi", "uvicorn", "sqlalchemy==2.0.54", "alembic", "psycopg[binary]",
  "pydantic-settings", "argon2-cffi", "python-multipart", "email-validator",
  "boto3", "pypdf", "celery", "redis", "cryptography"
]

[project.optional-dependencies]
test = ["pytest", "httpx", "ruff", "moto[server]", "reportlab"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
