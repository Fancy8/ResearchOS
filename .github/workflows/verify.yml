name: ResearchOS verification
on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: researchos-verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  windows-integration:
    runs-on: windows-2022
    timeout-minutes: 35
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '26.1.0'
      - name: Build runtime and verify in one service session
        run: |
          # Keep service launchers and their consumers in the same pwsh process.
          # setup.ps1 also establishes the project-local runtime environment.
          try {
            ./tools/setup.ps1
            $python=Join-Path $PWD 'runtime/venv/Scripts/python.exe'
            & $python tools/broker_status.py
            if($LASTEXITCODE -ne 0){throw 'Broker unavailable immediately after setup'}
            npm --prefix frontend exec playwright install chromium
            if($LASTEXITCODE -ne 0){throw 'Browser installation failed'}
            ./tools/verify.ps1
          } finally {
            # Redis has no authentication in this loopback-only synthetic CI setup.
            # Keep only startup/shutdown diagnostics, never task bodies or app logs.
            foreach($log in @('runtime/redis.stdout.log','runtime/redis.stderr.log')) {
              if(Test-Path -LiteralPath $log) {
                Get-Content -LiteralPath $log -Tail 20 |
                  Where-Object { $_ -match '(?i)ready to accept|server initialized|fatal|error|failed|shutdown|warning|invalid' } |
                  ForEach-Object { Write-Output $_ }
              }
            }
          }
      - name: Retain test reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: researchos-verification
          path: |
            artifacts/*.xml
            artifacts/playwright-report/
          retention-days: 7
