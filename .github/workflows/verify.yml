name: ResearchOS verification
on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  windows-integration:
    runs-on: windows-2022
    timeout-minutes: 35
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '26.1.0'
      - name: Build project-local runtime and services
        run: ./tools/setup.ps1
      - name: Install project-local browser
        run: |
          $env:PLAYWRIGHT_BROWSERS_PATH=Join-Path $PWD 'runtime/browsers'
          $env:TEMP=Join-Path $PWD 'runtime/tmp'
          $env:TMP=$env:TEMP
          $env:npm_config_cache=Join-Path $PWD 'runtime/cache/npm'
          npm --prefix frontend exec playwright install chromium
          if($LASTEXITCODE -ne 0){throw 'Browser installation failed'}
      - name: Verify database, API, contracts and browser flow
        run: ./tools/verify.ps1
      - name: Retain test reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: researchos-verification
          path: |
            artifacts/*.xml
            artifacts/playwright-report/
          retention-days: 7
